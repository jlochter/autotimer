[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "autotimer"
version = "1.0.0"
description = "Japanese Video Script Aligner — aligns Whisper transcription with PDF scripts using Gemini AI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "faster-whisper",
    "google-genai",
    "pysubs2",
    "torch",
]

[project.urls]
Homepage = "https://github.com/jlochter/autotimer"
