[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["autotimer*"]

[tool.setuptools.package-data]
"autotimer.prompts" = ["*.md"]

[project]
name = "autotimer"
version = "1.0.0"
description = "Japanese Video Script Aligner — aligns Whisper transcription with PDF scripts using Gemini AI"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "faster-whisper",
    "google-genai",
    "pysubs2",
    "torch",
]

[project.urls]
Homepage = "https://github.com/jlochter/autotimer"
